name: Rust Linux and macOS
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release -p arb-app --locked
      - run: python3 scripts/verify_protocol_samples.py && python3 scripts/verify_simulation_samples.py
      - name: Validate Linux unit with local test paths (do not install or start)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('deploy/robinhood-arb.service').read_text()
          source = source.replace('/usr/local/bin/robinhood-arb', str(Path('target/release/arb-app').resolve()))
          source = source.replace('User=robinhood-arb', 'User=' + os.environ['USER'])
          source = source.replace('Group=robinhood-arb', 'Group=' + os.environ['USER'])
          source = source.replace('/var/lib/robinhood-arb', str(Path.cwd()))
          Path('/tmp/robinhood-arb.service').write_text(source)
          PY
          systemd-analyze verify /tmp/robinhood-arb.service
