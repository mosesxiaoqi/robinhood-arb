[workspace]
members = ["crates/arb-core", "crates/arb-adapters", "crates/arb-research", "crates/arb-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
alloy-primitives = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
thiserror = "2"
